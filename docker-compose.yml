services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sunshine
      POSTGRES_USER: sunshine
      POSTGRES_PASSWORD: sunshine_local
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - sunshine_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sunshine -d sunshine']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sunshine_pg:
